<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>语音模块 · 看得到它在干什么</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --card: #fff;
    --line: #e4e6eb;
    --fg: #1b1f24;
    --muted: #6b7280;
    --accent: #2f6fed;
    --ok: #16a34a;
    --warn: #d97706;
    --err: #dc2626;
    --chip: #eef1f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --line: #262b35;
      --fg: #e7e9ee;
      --muted: #9aa3b2;
      --chip: #212630;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    margin: 0; padding: 34px 20px 44px; background: var(--bg); color: var(--fg);
    line-height: 1.65;
  }
  header, main, footer { max-width: 1040px; margin-left: auto; margin-right: auto; }

  /* Everything on this page is centered: the title, the two cards, the footnotes.
     The two cards are one row of equal halves, each with its own inner scroll area,
     so neither one grows the other. */
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; }
  h1 { font-size: 20px; margin: 0; font-weight: 650; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; font-size: 13px; white-space: nowrap;
  }
  .sub {
    color: var(--muted); font-size: 13px; text-align: center;
    max-width: 720px; margin: 12px auto 24px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.listening { background: var(--ok); }
  .dot.thinking { background: var(--warn); animation: pulse 1s ease-in-out infinite; }
  .dot.speaking { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
  .dot.error { background: var(--err); }
  @keyframes pulse { 50% { opacity: .3; } }

  main { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 900px) {
    /* minmax(0,1fr) matters: with plain 1fr a long, unbreakable line in the log can widen
       its column (measured: the two cards came out visibly unequal). */
    main { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: stretch; }
  }

  .card {
    display: flex; flex-direction: column; min-width: 0;
    /* One fixed height for both cards, so they stay identical however much content arrives.
       Overflow scrolls inside (below), instead of one card growing taller than the other. */
    height: clamp(380px, 62vh, 680px);
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  }
  .card-head {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--muted);
  }
  .card-head .spacer { margin-left: auto; }

  .talk-body { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; padding: 14px 16px 16px; }
  .transcript { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding-right: 6px; scrollbar-width: thin; }
  .bubble { margin: 0 0 12px; }
  .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .text { margin: 0; white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; }
  .me .who { color: var(--accent); }
  .empty { color: var(--muted); font-size: 14px; text-align: center; margin: 28px 0 0; }

  .controls { flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
              gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  /* The hint sits under the buttons, centered -- keeping it on the same row pushed the
     buttons visibly off-centre. */
  .hint { flex: 0 0 auto; text-align: center; margin: 8px 0 0; }
  button {
    font: inherit; font-size: 15px; padding: 10px 18px; border-radius: 10px;
    border: 1px solid transparent; background: var(--accent); color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: default; }
  button.secondary { background: transparent; color: inherit; border-color: var(--line); }
  button.ghost {
    background: transparent; color: var(--muted); border-color: var(--line);
    font-size: 12px; padding: 4px 10px; border-radius: 8px;
  }
  .hint { font-size: 12px; color: var(--muted); }

  .log {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: thin;
    list-style: none; margin: 0; padding: 10px 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px;
  }
  .log:empty::after {
    content: "还没有动静 —— 点「开始对话」说一句试试";
    display: block; padding: 24px 6px; text-align: center; color: var(--muted);
    font-family: system-ui, -apple-system, "PingFang SC", sans-serif; font-size: 13px;
  }
  /* The time column is fixed, the message column must be allowed to shrink (minmax(0,1fr))
     or a long detail line pushes the column wider than its half of the page. */
  .log li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; padding: 5px 6px;
            border-left: 2px solid var(--line); margin-bottom: 2px; }
  .log .t { color: var(--muted); }
  .log .m { min-width: 0; word-break: break-word; overflow-wrap: anywhere; }
  .log .tag { font-size: 11px; padding: 0 6px; border-radius: 5px; background: var(--chip);
              color: var(--muted); margin-right: 6px; white-space: nowrap; }
  .log code { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .log li.thinking { border-left-color: var(--warn); }
  .log li.tool { border-left-color: var(--accent); }
  .log li.result { border-left-color: #8b5cf6; }
  .log li.node { border-left-color: #14b8a6; }
  .log li.file { border-left-color: #eab308; }
  .log li.error { border-left-color: var(--err); }
  .log li.timing { border-left-color: var(--ok); }
  .log li.turn { border-left-color: var(--line); background: var(--chip); border-radius: 6px; }

  footer {
    margin-top: 22px; font-size: 12px; color: var(--muted); text-align: center;
    max-width: 820px; line-height: 1.9;
  }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
</style>
</head>
<body>
<header>
  <h1>语音模块</h1>
  <span class="pill" id="pill"><span class="dot" id="dot"></span><span id="statusText">未开始</span></span>
</header>
<p class="sub">
  这个页面只管“听”和“说”。想问题、查东西、调工具都在外部的智能体平台上 ——
  右边那栏就是它实时的动静（思考 / 工具调用 / 流程节点 / 耗时）。
</p>

<main>
  <section class="card">
    <div class="card-head">对话<span class="spacer"></span>
      <button class="ghost" id="clear">清空</button>
    </div>
    <div class="talk-body">
      <div class="transcript" id="transcript">
        <p class="empty">点下面的「开始对话」，然后直接说话。</p>
      </div>
      <div class="controls">
        <button id="start">开始对话</button>
        <button id="stop" class="secondary" disabled>停止</button>
      </div>
      <p class="hint" id="hint">停顿约 0.6 秒就会当作你说完了</p>
    </div>
  </section>

  <section class="card">
    <div class="card-head">它在干什么<span class="spacer"></span>
      <span class="hint" id="logCount">0 条</span>
    </div>
    <ol class="log" id="log"></ol>
  </section>
</main>

<footer>
  WebSocket：<code id="wsurl"></code> —— 二进制帧是音频，文本帧是事件（两者互不影响）。<br>
  连不上？在网址后面加 <code>?ws=ws://127.0.0.1:8090/</code> 手动指定模块地址；
  页面必须经 <code>http://localhost</code> 或 https 打开（本地文件常拿不到麦克风）。
</footer>

<script>
(() => {
  // The page is hosted next to the platform, but the voice module listens on its own port.
  // Two hosting shapes, and getting this wrong means "连接已断开" with no clue why:
  //   preview : "abc-8080.cnb.run" -> the port is inside the hostname, so swap it
  //   local   : "localhost:8080"   -> keep the host, use the module's port explicitly
  // (Measured: using the old rule on localhost produced "ws://localhost/" -- port 80, never
  //  the module. The IDE forwards the port for you, but the page still has to name it.)
  const MODULE_PORT = '8090';
  const override = new URLSearchParams(location.search).get('ws');
  function moduleWsUrl() {
    const swapped = location.hostname.replace(/-\d+\./, `-${MODULE_PORT}.`);
    const host = swapped !== location.hostname ? swapped : `${location.hostname}:${MODULE_PORT}`;
    return `${location.protocol === 'https:' ? 'wss' : 'ws'}://${host}/`;
  }
  const WS_URL = override || moduleWsUrl();

  const el = (id) => document.getElementById(id);
  const dot = el('dot'), statusText = el('statusText'), transcript = el('transcript');
  const startBtn = el('start'), stopBtn = el('stop'), logEl = el('log'), logCount = el('logCount');
  const hint = el('hint');
  el('wsurl').textContent = WS_URL;

  let ws = null, ctx = null, mic = null, node = null, silent = null;
  let nextPlay = 0, myTurn = null;

  // ---------------------------------------------------------------- status
  const STATES = {
    listening: ['listening', '在听…'],
    thinking:  ['thinking',  '正在想…'],
    speaking:  ['speaking',  '正在说…'],
    error:     ['error',     '出错了'],
    idle:      ['',          '未开始'],
  };
  function setState(state) {
    const [cls, label] = STATES[state] || STATES.idle;
    dot.className = 'dot ' + cls;
    statusText.textContent = label;
  }

  // ---------------------------------------------------------------- transcript
  function bubble(who, cls) {
    const wrap = document.createElement('div');
    wrap.className = 'bubble' + (cls ? ' ' + cls : '');
    const w = document.createElement('div'); w.className = 'who'; w.textContent = who;
    const t = document.createElement('p'); t.className = 'text';
    wrap.append(w, t); transcript.append(wrap);
    transcript.scrollTop = transcript.scrollHeight;
    return t;
  }
  function note(who, text) {
    const empty = transcript.querySelector('.empty');
    if (empty) empty.remove();
    bubble(who, who === '你' ? 'me' : '').textContent = text;
  }
  function say(text) {
    if (!myTurn) myTurn = bubble('它', '');
    myTurn.textContent += text;
    transcript.scrollTop = transcript.scrollHeight;
  }

  // ---------------------------------------------------------------- activity log
  const TAGS = { thinking: '思考', tool: '工具', result: '结果', node: '节点',
                 workflow: '流程', file: '文件', error: '出错', timing: '耗时',
                 interrupt: '打断', user: '你', say: '它' };
  const MAX_LINES = 300;
  const atBottom = () => logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 40;

  function addLog(kind, text, detail) {
    const stick = atBottom();
    const li = document.createElement('li');
    li.className = kind;
    const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
    const t = document.createElement('span'); t.className = 't'; t.textContent = time;
    const m = document.createElement('span'); m.className = 'm';
    const tag = document.createElement('span'); tag.className = 'tag';
    tag.textContent = TAGS[kind] || kind;
    m.append(tag, document.createTextNode(text || ''));
    if (detail) {
      const c = document.createElement('code');
      c.textContent = ' ' + detail;
      m.append(c);
    }
    li.append(t, m);
    logEl.append(li);
    while (logEl.children.length > MAX_LINES) logEl.firstChild.remove();
    logCount.textContent = logEl.children.length + ' 条';
    if (stick) logEl.scrollTop = logEl.scrollHeight;
  }

  // ---------------------------------------------------------------- audio
  function play(i16) {
    if (!ctx) return;
    const buf = ctx.createBuffer(1, i16.length, ctx.sampleRate);
    const ch = buf.getChannelData(0);
    for (let i = 0; i < i16.length; i++) ch[i] = i16[i] / 0x8000;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const now = ctx.currentTime;
    if (nextPlay < now) nextPlay = now + 0.05;   // small jitter buffer
    src.connect(ctx.destination);
    src.start(nextPlay);
    nextPlay += buf.duration;
  }

  // ---------------------------------------------------------------- the event channel
  // Text frames carry JSON process events; binary frames are still just PCM audio.
  function onEvent(raw) {
    let note_;
    try { note_ = JSON.parse(raw); } catch (e) { return; }
    const kind = note_.kind;
    // The pipeline also sends its own client-protocol messages on this socket
    // ({"label":"rtvi-ai",...}). They are not this contract, so anything without `kind` is
    // ignored rather than guessed at.
    if (!kind) return;
    if (kind === 'state') { setState(note_.state); return; }
    if (kind === 'user') {
      note('你', note_.text);
      addLog('turn', '新一轮：' + note_.text);
      myTurn = null;
      return;
    }
    if (kind === 'say') { say(note_.text); return; }
    if (kind === 'tool') { addLog('tool', note_.text, note_.detail); return; }
    if (kind === 'node') {
      addLog('node', (note_.state === 'started' ? '开始：' : '结束：') + note_.text,
             note_.elapsed != null ? note_.elapsed + 's' : '');
      return;
    }
    if (kind === 'workflow') { addLog('workflow', '工作流' + (note_.state === 'started' ? '开始' : '结束')); return; }
    if (kind === 'file') { addLog('file', note_.text); return; }
    if (kind === 'interrupt') { addLog('interrupt', '你插话了 —— 正在停'); return; }
    if (kind === 'error') { addLog('error', note_.text); return; }
    if (kind === 'timing') { addLog('timing', note_.text); return; }
    addLog(kind, note_.text || '');  // a kind the module added later: still show it
  }

  // ---------------------------------------------------------------- start / stop
  async function start() {
    startBtn.disabled = true;
    setState('idle');
    hint.textContent = '正在连接…';
    try {
      ctx = new AudioContext({ sampleRate: 16000 });   // match the module's PCM rate
      await ctx.resume();

      ws = new WebSocket(WS_URL);
      ws.binaryType = 'arraybuffer';
      ws.onmessage = (e) => {
        if (typeof e.data === 'string') onEvent(e.data);        // process event
        else play(new Int16Array(e.data));                      // audio
      };
      ws.onclose = () => { addLog('error', '连接已断开'); stop(); };
      await new Promise((resolve, reject) => { ws.onopen = resolve; ws.onerror = reject; });

      mic = await navigator.mediaDevices.getUserMedia({ audio: {
        channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });

      const src = ctx.createMediaStreamSource(mic);
      node = ctx.createScriptProcessor(1024, 1, 1);
      node.onaudioprocess = (ev) => {
        if (!ws || ws.readyState !== 1) return;
        const f32 = ev.inputBuffer.getChannelData(0);
        const i16 = new Int16Array(f32.length);
        for (let i = 0; i < f32.length; i++) {
          const v = Math.max(-1, Math.min(1, f32[i]));
          i16[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
        }
        ws.send(i16.buffer);
      };
      // keep the processor alive without playing the microphone back into the speakers
      silent = ctx.createGain();
      silent.gain.value = 0;
      src.connect(node);
      node.connect(silent);
      silent.connect(ctx.destination);

      stopBtn.disabled = false;
      hint.textContent = '停顿约 0.6 秒就会当作你说完了';
      setState('listening');
      addLog('turn', '已连接 —— 直接说话');
    } catch (err) {
      addLog('error', `启动失败：${err && err.name ? err.name : err}`);
      hint.textContent = '麦克风需要授权；页面必须通过 https 或 localhost 打开';
      stop();
    }
  }

  function stop() {
    try { node && node.disconnect(); } catch (e) {}
    try { silent && silent.disconnect(); } catch (e) {}
    try { mic && mic.getTracks().forEach((t) => t.stop()); } catch (e) {}
    try { ws && ws.readyState === 1 && ws.close(); } catch (e) {}
    try { ctx && ctx.close(); } catch (e) {}
    ws = null; ctx = null; mic = null; node = null; silent = null;
    nextPlay = 0; myTurn = null;
    startBtn.disabled = false;
    stopBtn.disabled = true;
    setState('idle');
  }

  el('clear').addEventListener('click', () => {
    transcript.innerHTML = '<p class="empty">点下面的「开始对话」，然后直接说话。</p>';
    logEl.innerHTML = '';
    logCount.textContent = '0 条';
    myTurn = null;
  });
  startBtn.addEventListener('click', start);
  stopBtn.addEventListener('click', stop);
})();
</script>
</body>
</html>
