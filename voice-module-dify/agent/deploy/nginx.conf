# Reverse proxy for a self-hosted agent platform (A).
#
# Why this file exists at all: the platform's UI and its API must be reachable on the **same
# origin** -- the browser calls /console/api/* on whatever host served the page. The stock
# compose provides that with an nginx container, but in this environment the Docker daemon
# cannot see the workspace, so **file bind-mounts arrive as empty directories** and that
# nginx can never start. A file baked into an image has no such problem, so we build our own.

server {
    listen 80;
    server_name _;
    client_max_body_size 100m;

    # Long-lived streaming (the chat API answers as text/event-stream).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Everything the browser and the service API need, on one origin.
    location /console/api {
        proxy_pass http://api:5001;
    }
    location /api {
        proxy_pass http://api:5001;
    }
    # the service API the voice module calls: /v1/chat-messages
    location /v1 {
        proxy_pass http://api:5001;
    }
    location /files {
        proxy_pass http://api:5001;
    }
    location /explore {
        proxy_pass http://api:5001;
    }

    # the UI itself
    location / {
        proxy_pass http://web:3000;
    }

    # Handy for the "import an application definition file" dialog: the platform asks for a
    # file from the *browser's* machine, while the definition lives on the server. Serving it
    # here means one click to download, then pick it in that dialog.
    location /dsl/ {
        alias /usr/share/nginx/dsl/;
        add_header Content-Disposition "attachment";
        default_type text/yaml;
    }

    # The voice module's browser client. It talks to the module over a websocket on its own
    # port (see server/ws_app.py) -- WebSocket rides on TCP, so it works through ordinary
    # HTTP port forwarding, which is exactly what WebRTC media cannot do.
    location /voice/ {
        alias /usr/share/nginx/voice/;
        index voice-client.html;
    }
}
