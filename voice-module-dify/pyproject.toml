[project]
name = "voice-module"
version = "0.0.1"
description = "Phase 3: the voice module (ears and mouth) that plugs into an existing agent platform (the brain)"
requires-python = ">=3.12"
dependencies = [
    # Framework only. This project deliberately does NOT depend on pipecat-quickstart:
    # phase 1 (pipeline) and phase 2 (business logic) live there, phase 3 is decoupled.
    "pipecat-ai[whisper,piper,silero,webrtc,runner,websocket]>=1.12.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "httpx>=0.27.0",  # streaming client for the brain (the platform)
]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.12.0"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# Chinese punctuation and full-width characters are *functional content* here: the spoken
# lines we send to TTS, the whisper prompt, and the sentence-splitting regex for Chinese.
# Same convention as phase 2: code and terminal output stay ASCII, but what the bot says
# and what it matches against are Chinese on purpose.
ignore = ["RUF001", "RUF002", "RUF003"]
