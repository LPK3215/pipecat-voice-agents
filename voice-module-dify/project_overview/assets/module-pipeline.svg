<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/></marker><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/></filter></defs><rect width="1200" height="470" fill="url(#bg)"/><text x="60" y="48" font-size="24" font-weight="700" fill="#0f172a">模块内部管线 · What happens between transport and platform</text><text x="60" y="74" font-size="13" fill="#64748b">v0.0.1 · 模块只负责听与说；标紫的「brain 适配器」是它与平台之间唯一的桥</text><text x="60" y="112" font-size="13" font-weight="600" fill="#475569">Pipeline（顺序即职责链）</text><g filter="url(#soft)"><rect x="44.0" y="130" width="140" height="76" rx="12" fill="#3b82f6"/></g><text x="114.0" y="162" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">传输入口</text><text x="114.0" y="184" text-anchor="middle" font-size="10.5" fill="#ffffff" opacity="0.9">WebSocket / WebRTC</text><line x1="186.0" y1="168.0" x2="204.0" y2="168.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><g filter="url(#soft)"><rect x="206.0" y="130" width="140" height="76" rx="12" fill="#06b6d4"/></g><text x="276.0" y="162" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">VAD</text><text x="276.0" y="184" text-anchor="middle" font-size="10.5" fill="#ffffff" opacity="0.9">说完判定</text><line x1="348.0" y1="168.0" x2="366.0" y2="168.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><g filter="url(#soft)"><rect x="368.0" y="130" width="140" height="76" rx="12" fill="#06b6d4"/></g><text x="438.0" y="162" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">STT</text><text x="438.0" y="184" text-anchor="middle" font-size="10.5" fill="#ffffff" opacity="0.9">本地 Whisper</text><line x1="510.0" y1="168.0" x2="528.0" y2="168.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><g filter="url(#soft)"><rect x="530.0" y="130" width="140" height="76" rx="12" fill="#64748b"/></g><text x="600.0" y="162" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">轮次判定</text><text x="600.0" y="184" text-anchor="middle" font-size="10.5" fill="#ffffff" opacity="0.9">用户说完没</text><line x1="672.0" y1="168.0" x2="690.0" y2="168.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><g filter="url(#soft)"><rect x="692.0" y="130" width="140" height="76" rx="12" fill="#8b5cf6"/></g><text x="762.0" y="162" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">brain 适配器</text><text x="762.0" y="184" text-anchor="middle" font-size="10.5" fill="#ffffff" opacity="0.9">平台桥接</text><line x1="834.0" y1="168.0" x2="852.0" y2="168.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><g filter="url(#soft)"><rect x="854.0" y="130" width="140" height="76" rx="12" fill="#14b8a6"/></g><text x="924.0" y="162" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">TTS</text><text x="924.0" y="184" text-anchor="middle" font-size="10.5" fill="#ffffff" opacity="0.9">本地 Piper</text><line x1="996.0" y1="168.0" x2="1014.0" y2="168.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><g filter="url(#soft)"><rect x="1016.0" y="130" width="140" height="76" rx="12" fill="#3b82f6"/></g><text x="1086.0" y="162" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">传输输出</text><text x="1086.0" y="184" text-anchor="middle" font-size="10.5" fill="#ffffff" opacity="0.9">回传音频</text><text x="60" y="270" font-size="13" font-weight="600" fill="#475569">brain 适配器（server/brain.py）负责的三件事</text><g filter="url(#soft)"><rect x="70.0" y="288" width="340" height="72" rx="12" fill="#ffffff"/></g><rect x="70.0" y="288" width="6" height="72" rx="3" fill="#8b5cf6"/><text x="92.0" y="318" font-size="13.5" font-weight="700" fill="#8b5cf6">说完才问</text><text x="92.0" y="342" font-size="11.5" fill="#475569">平台只拿到文本，听不到音频</text><g filter="url(#soft)"><rect x="430.0" y="288" width="340" height="72" rx="12" fill="#ffffff"/></g><rect x="430.0" y="288" width="6" height="72" rx="3" fill="#8b5cf6"/><text x="452.0" y="318" font-size="13.5" font-weight="700" fill="#8b5cf6">边收边按句喂 TTS</text><text x="452.0" y="342" font-size="11.5" fill="#475569">首句就开口，不等全文</text><g filter="url(#soft)"><rect x="790.0" y="288" width="340" height="72" rx="12" fill="#ffffff"/></g><rect x="790.0" y="288" width="6" height="72" rx="3" fill="#8b5cf6"/><text x="812.0" y="318" font-size="13.5" font-weight="700" fill="#8b5cf6">平台慢时填场 · 插话则停</text><text x="812.0" y="342" font-size="11.5" fill="#475569">FILLER_DELAY_SECS / interrupt</text><text x="60" y="408" font-size="12" fill="#64748b">旁路观测：server/observability.py 记录分阶段时间线（听到 / 平台首字 / 首句 / 交给 TTS），不改变数据方向。</text><text x="60" y="438" font-size="11" fill="#94a3b8">Generated by scripts/visualization/generate_module_pipeline.py — re-run it after changing the pipeline.</text></svg>