<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="600" viewBox="0 0 1020 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1020" height="600" fill="#f8fafc"/>

  <text x="510" y="46" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">pipecat-ai-test - positioning and call direction of the three projects</text>
  <text x="510" y="72" text-anchor="middle" font-size="13" fill="#64748b">one repository · three projects · two opposite call directions · plus one framework survey</text>

  <rect x="35" y="110" width="300" height="300" rx="14" fill="#ffffff" stroke="#86efac" stroke-width="2.5"/>
  <rect x="35" y="110" width="300" height="8" rx="4" fill="#16a34a"/>
  <text x="185" y="154" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a" font-family="ui-monospace, Menlo, Consolas, monospace">pipecat-quickstart</text>
  <text x="185" y="180" text-anchor="middle" font-size="12" fill="#64748b">v0.1.0 · MIT</text>
  <rect x="137" y="194" width="96" height="24" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <text x="185" y="211" text-anchor="middle" font-size="12" font-weight="600" fill="#16a34a">Full stack</text>
  <line x1="59" y1="238" x2="311" y2="238" stroke="#e2e8f0" stroke-width="1"/>
  <text x="59" y="268" font-size="11.5" fill="#94a3b8">In one line</text>
  <text x="311" y="268" text-anchor="end" font-size="12" fill="#1e293b">Voice is the product itself</text>
  <text x="59" y="298" font-size="11.5" fill="#94a3b8">Who thinks</text>
  <text x="311" y="298" text-anchor="end" font-size="12" fill="#1e293b">Itself (LLM in the pipeline)</text>
  <text x="59" y="328" font-size="11.5" fill="#94a3b8">Voice lives</text>
  <text x="311" y="328" text-anchor="end" font-size="12" fill="#1e293b">Core (the pipeline)</text>
  <text x="59" y="358" font-size="11.5" fill="#94a3b8">Direction</text>
  <text x="311" y="358" text-anchor="end" font-size="12" fill="#1e293b">- (self-contained)</text>
  <rect x="59" y="342" width="252" height="36" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="185" y="365" text-anchor="middle" font-size="11" font-weight="600" fill="#16a34a" font-family="ui-monospace, Menlo, Consolas, monospace">VAD -&gt; ASR -&gt; LLM -&gt; TTS</text>

  <rect x="360" y="110" width="300" height="300" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2.5"/>
  <rect x="360" y="110" width="300" height="8" rx="4" fill="#2563eb"/>
  <text x="510" y="154" text-anchor="middle" font-size="16" font-weight="700" fill="#2563eb" font-family="ui-monospace, Menlo, Consolas, monospace">voice-module-dify</text>
  <text x="510" y="180" text-anchor="middle" font-size="12" fill="#64748b">v0.0.1 · MIT</text>
  <rect x="462" y="194" width="96" height="24" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="510" y="211" text-anchor="middle" font-size="12" font-weight="600" fill="#2563eb">Add-on</text>
  <line x1="384" y1="238" x2="636" y2="238" stroke="#e2e8f0" stroke-width="1"/>
  <text x="384" y="268" font-size="11.5" fill="#94a3b8">In one line</text>
  <text x="636" y="268" text-anchor="end" font-size="12" fill="#1e293b">Voice as a part, it calls out</text>
  <text x="384" y="298" font-size="11.5" fill="#94a3b8">Who thinks</text>
  <text x="636" y="298" text-anchor="end" font-size="12" fill="#1e293b">External platform (Dify, ...)</text>
  <text x="384" y="328" font-size="11.5" fill="#94a3b8">Voice lives</text>
  <text x="636" y="328" text-anchor="end" font-size="12" fill="#1e293b">Standalone service</text>
  <text x="384" y="358" font-size="11.5" fill="#94a3b8">Direction</text>
  <text x="636" y="358" text-anchor="end" font-size="12" fill="#1e293b">me -&gt; platform</text>
  <rect x="384" y="342" width="252" height="36" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="510" y="365" text-anchor="middle" font-size="11" font-weight="600" fill="#2563eb" font-family="ui-monospace, Menlo, Consolas, monospace">web (yours) -&gt; module -&gt; platform (theirs)</text>

  <rect x="685" y="110" width="300" height="300" rx="14" fill="#ffffff" stroke="#c4b5fd" stroke-width="2.5"/>
  <rect x="685" y="110" width="300" height="8" rx="4" fill="#7c3aed"/>
  <text x="835" y="154" text-anchor="middle" font-size="16" font-weight="700" fill="#7c3aed" font-family="ui-monospace, Menlo, Consolas, monospace">pipecat-open-webui</text>
  <text x="835" y="180" text-anchor="middle" font-size="12" fill="#64748b">v0.11.4 baseline · dual license</text>
  <rect x="787" y="194" width="96" height="24" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="835" y="211" text-anchor="middle" font-size="12" font-weight="600" fill="#7c3aed">Symbiont</text>
  <line x1="709" y1="238" x2="961" y2="238" stroke="#e2e8f0" stroke-width="1"/>
  <text x="709" y="268" font-size="11.5" fill="#94a3b8">In one line</text>
  <text x="961" y="268" text-anchor="end" font-size="12" fill="#1e293b">Voice as a part, called by host</text>
  <text x="709" y="298" font-size="11.5" fill="#94a3b8">Who thinks</text>
  <text x="961" y="298" text-anchor="end" font-size="12" fill="#1e293b">Host system (Open WebUI)</text>
  <text x="709" y="328" font-size="11.5" fill="#94a3b8">Voice lives</text>
  <text x="961" y="328" text-anchor="end" font-size="12" fill="#1e293b">A part inside the host</text>
  <text x="709" y="358" font-size="11.5" fill="#94a3b8">Direction</text>
  <text x="961" y="358" text-anchor="end" font-size="12" fill="#1e293b">host -&gt; me</text>
  <rect x="709" y="342" width="252" height="36" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="835" y="365" text-anchor="middle" font-size="11" font-weight="600" fill="#7c3aed" font-family="ui-monospace, Menlo, Consolas, monospace">host (Open WebUI) -&gt; voice part (me)</text>


  <text x="510" y="466" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">② and ③ point in opposite directions - that is why neither can replace the other, and why both exist.</text>
  <text x="510" y="500" text-anchor="middle" font-size="11" fill="#64748b">License: root MIT | pipecat-quickstart MIT | voice-module-dify MIT | pipecat-open-webui = Open WebUI License (branding kept) + MIT for new files</text>
  <text x="510" y="528" text-anchor="middle" font-size="11" fill="#64748b">A separate framework survey lives under research/ (a document, not a project)</text>
  <text x="510" y="566" text-anchor="middle" font-size="11" fill="#94a3b8">https://cnb.cool/lpk3215/pipecat-ai-test</text>
</svg>
